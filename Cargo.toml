[package]
name = "satya"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.7"
# Standard tower middleware for axum; `trace` gives per-request tracing spans
# (method, path, status, latency) that flow into our existing tracing subscriber.
tower-http = { version = "0.6", features = ["trace"] }
# `serde` gives us Deserialize for Txid/Amount/Network and the amount/network
# serde helpers (`as_btc`, `as_core_arg`) our hand-rolled RPC response structs
# rely on. Previously enabled transitively via bitcoincore-rpc.
bitcoin = { version = "0.32", features = ["serde"] }
# Async JSON-RPC transport. rustls-tls matches the previous minreq-https TLS
# stack; `json` gives request/response JSON (body building + parsing).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
futures = "0.3"
zeromq = "0.6.0"
# Seeded RNG for the simulation harness only (behind the `simulation` feature).
rand = { version = "0.8", optional = true }

[features]
# Compiles the offline mempool/network simulation harness (MockNode,
# SimulatedRpc, the sim HTTP server, and their tests). Off by default so the
# release build ships none of it.
simulation = ["dep:rand"]

# Lean production binary: link-time optimization across crates and a single
# codegen unit trade longer compile time for a smaller, faster release build.
[profile.release]
lto = true
codegen-units = 1
