[package]
name = "btc-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.7"
# Standard tower middleware for axum; `trace` gives per-request tracing spans
# (method, path, status, latency) that flow into our existing tracing subscriber.
tower-http = { version = "0.6", features = ["trace"] }
bitcoincore-rpc = "0.19"
bitcoin = "0.32"
# bitcoincore-rpc pulls in jsonrpc's `minreq_http` transport already, but doesn't request
# minreq's `https` feature. Depending on minreq directly here unifies that feature across the
# build so the shared jsonrpc/minreq instance gains HTTPS (rustls) support.
minreq = { version = "2.14", features = ["https"] }
# Same base64 version `jsonrpc` uses internally for its own basic-auth header encoding; pinned
# here directly since our custom RPC transport (src/rpc.rs) builds that header itself.
base64 = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
